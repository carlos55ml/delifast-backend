spring:
  application:
    name: delifast-backend
  profiles:
    default: dev
  config:
    # Variables locales (credenciales de Supabase). En producción llegan como variables de entorno.
    import: optional:file:.env[.properties]
  datasource:
    # Base de datos PostgreSQL de Supabase, a través del Session pooler (IPv4).
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # El pooler del plan gratuito admite pocas conexiones; dev y prod comparten ese límite por proyecto.
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Flyway; JPA solo comprueba que las entidades coinciden.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Carga las colecciones perezosas (líneas, historial...) de varios pedidos en una consulta.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Las tablas van en public (las migraciones usan nombres public.xxx). El historial
    # flyway_schema_history va en el esquema flyway, que la API de datos de Supabase no expone.
    # auth, storage y realtime son de Supabase: solo se referencian desde las migraciones.
    schemas: flyway
    default-schema: flyway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase Auth firma los access tokens con claves asimétricas y publica las
          # públicas en este JWKS. Se descargan en la primera petición, no al arrancar.
          jwk-set-uri: ${SUPABASE_JWKS_URL:${delifast.supabase.url}/auth/v1/.well-known/jwks.json}
          issuer-uri: ${delifast.supabase.url}/auth/v1
          jws-algorithms: ES256,RS256
          audiences: authenticated
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

delifast:
  supabase:
    # Proyecto delifast-dev por defecto; en producción se define SUPABASE_URL.
    url: ${SUPABASE_URL:https://ivbnvdtdvzphgmurhuts.supabase.co}
    # Clave service_role para la Admin API de Auth (alta de cuentas). Solo en .env.
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

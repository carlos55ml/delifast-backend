spring:
  application:
    name: delifast-backend
  profiles:
    default: dev
  config:
    # Variables locales (credenciales de Supabase). En producción llegan como variables de entorno.
    import: optional:file:.env[.properties]
  datasource:
    # Base de datos PostgreSQL de Supabase, a través del Session pooler (IPv4).
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # El pooler del plan gratuito admite pocas conexiones; dev y prod comparten ese límite por proyecto.
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Flyway; JPA solo comprueba que las entidades coinciden.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Las tablas van en public (las migraciones usan nombres public.xxx). El historial
    # flyway_schema_history va en el esquema flyway, que la API de datos de Supabase no expone.
    # auth, storage y realtime son de Supabase: solo se referencian desde las migraciones.
    schemas: flyway
    default-schema: flyway
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

delifast:
  supabase:
    url: ${SUPABASE_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

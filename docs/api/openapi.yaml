openapi: 3.1.0
info:
  title: DeliFast API
  version: 0.2.0
  description: |
    Contrato REST de la API de DeliFast (Spring Boot). Es la fuente de verdad compartida
    entre `DeliFast_Web` (que genera sus tipos con `npm run api:types`) y `DeliFast_Backend`
    (que lo copia en `docs/api/openapi.yaml` y lo implementa).

    Cubre la zona de **administración** (RF-28..RF-31), los **pedidos del negocio**
    (RF-14..RF-16, RF-20) y lo mínimo común (`/me`, `/localidades`). El resto del negocio y el
    repartidor se añadirán aquí cuando se programen.

    Convenciones:
    - JSON en `camelCase`. Fechas en ISO 8601 con zona (`2026-11-06T13:10:00Z`).
      Importes como número con 2 decimales.
    - Autenticación: `Authorization: Bearer <JWT de Supabase>`. El rol va en el claim
      `user_rol` (añadido por `custom_access_token_hook`). Todo `/admin/**` exige `ADMINISTRADOR`.
      Todo `/negocio/**` y las acciones del negocio sobre `/pedidos/{id}/...` exigen `NEGOCIO`
      (dueño o empleado, sin más restricciones en la v1) y solo actúan sobre el negocio del
      claim `negocio_id`: un pedido de otro negocio responde 404, no 403.
    - Errores con `application/problem+json` (RFC 9457), como ya hace `GlobalExceptionHandler`:
      400 validación (con `errores`), 401 sin token, 403 rol incorrecto, 404 no existe,
      409 conflicto (p. ej. email ya registrado, o el pedido ya cambió de estado porque otra
      persona del negocio se adelantó), 422 regla de negocio.
    - Las listas de administración son pequeñas (decenas de filas), así que se devuelven
      completas, sin paginar.
servers:
  - url: http://localhost:8080
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Perfil
  - name: Localidades
  - name: Administración
  - name: Negocio · Pedidos
    description: |
      Panel de pedidos del negocio (N01, N02, N08). Estados: RECIBIDO → EN_PREPARACION (aceptar)
      → LISTO → EN_REPARTO (asignar repartidor) → ENTREGADO (lo confirma el repartidor).
      RECIBIDO → RECHAZADO (rechazar). Cada cambio guarda una fila en `cambios_estado`.

      Tiempo real: la web no recibe los pedidos por la API sino por Supabase Realtime
      (`postgres_changes` sobre `public.pedidos` con `negocio_id=eq.<id>`, filtrado además por RLS).
      Al recibir un cambio vuelve a pedir `GET /negocio/pedidos`.
paths:
  /me:
    get:
      tags: [Perfil]
      operationId: obtenerPerfil
      summary: Perfil del usuario autenticado
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Perfil" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /localidades:
    get:
      tags: [Localidades]
      operationId: listarLocalidades
      summary: Localidades donde opera DeliFast
      description: Pública (también la usa la app al registrarse). Ordenadas por nombre.
      security: []
      responses:
        "200":
          description: Localidades
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Localidad" }

  /admin/resumen:
    get:
      tags: [Administración]
      operationId: obtenerResumenAdmin
      summary: Resumen de la plataforma (A01, RF-31)
      description: Indicadores del día (zona horaria Europe/Madrid), pedidos de hoy por negocio e incidencias recientes.
      responses:
        "200":
          description: Resumen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResumenAdmin" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /admin/negocios:
    get:
      tags: [Administración]
      operationId: listarNegociosAdmin
      summary: Negocios dados de alta (A02, RF-29)
      parameters:
        - name: activo
          in: query
          required: false
          description: Filtra por activos (`true`) o suspendidos (`false`). Sin él, todos.
          schema: { type: boolean }
      responses:
        "200":
          description: Negocios ordenados por nombre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NegocioAdmin" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [Administración]
      operationId: altaNegocio
      summary: Dar de alta un negocio y la cuenta de su dueño (A03, RF-28)
      description: |
        En una transacción: crea el negocio y la cuenta del dueño en Supabase Auth con la
        Admin API (`inviteUserByEmail`, con `app_metadata` = `{rol: NEGOCIO, negocio_id, es_dueno: true}`).
        El dueño recibe un email para crear su contraseña. Si falla la invitación, no se crea el negocio.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AltaNegocio" }
      responses:
        "201":
          description: Negocio creado
          headers:
            Location:
              description: URL del negocio creado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NegocioAdmin" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409":
          description: Ya existe una cuenta con ese email
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }

  /admin/negocios/{id}:
    parameters:
      - $ref: "#/components/parameters/NegocioId"
    put:
      tags: [Administración]
      operationId: editarNegocioAdmin
      summary: Corregir los datos básicos de un negocio (icono de editar en A02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatosNegocio" }
      responses:
        "200":
          description: Negocio actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NegocioAdmin" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /admin/negocios/{id}/activo:
    parameters:
      - $ref: "#/components/parameters/NegocioId"
    patch:
      tags: [Administración]
      operationId: cambiarActivoNegocio
      summary: Activar o suspender un negocio (interruptor de A02, RF-29)
      description: |
        Un negocio suspendido deja de aparecer en la app y sus cuentas no pueden iniciar sesión
        (el hook del token lo rechaza). Al suspender, el backend cierra las sesiones abiertas de
        sus cuentas con la Admin API (arquitectura 5.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties:
                activo: { type: boolean }
      responses:
        "200":
          description: Negocio actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NegocioAdmin" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /admin/incidencias:
    get:
      tags: [Administración]
      operationId: listarIncidenciasAdmin
      summary: Incidencias de todos los negocios (A04, RF-30)
      parameters:
        - name: estado
          in: query
          required: false
          description: |
            Uno o varios estados (`?estado=ABIERTA&estado=RESPONDIDA`). Sin él, todas.
            El filtro "Abiertas" de la web pide ABIERTA y RESPONDIDA (aún sin resolver).
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/EstadoIncidencia" }
        - name: negocioId
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Incidencias, de la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncidenciaAdmin" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /negocio:
    get:
      tags: [Negocio · Pedidos]
      operationId: obtenerMiNegocio
      summary: Datos del negocio del usuario (cabecera del panel)
      description: |
        Negocio del claim `negocio_id`. La configuración completa (horarios, logo, envío y mínimo,
        RF-18) se añadirá a este recurso con N07.
      responses:
        "200":
          description: Negocio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MiNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /negocio/abierto:
    patch:
      tags: [Negocio · Pedidos]
      operationId: cambiarAbiertoNegocio
      summary: Abrir o cerrar el negocio a mano (interruptor "Abierto" de la cabecera, RF-18)
      description: |
        Cambia `negocios.abierto_manual`. Con él a false el negocio no acepta pedidos aunque esté
        en horario; con él a true acepta pedidos solo dentro del horario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [abierto]
              properties:
                abierto: { type: boolean }
      responses:
        "200":
          description: Negocio actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MiNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /negocio/pedidos:
    get:
      tags: [Negocio · Pedidos]
      operationId: listarPedidosNegocio
      summary: Pedidos del negocio (tablero N01, RF-14)
      parameters:
        - name: estado
          in: query
          required: false
          description: |
            Uno o varios estados (`?estado=RECIBIDO&estado=LISTO`). Sin él, los activos:
            RECIBIDO, EN_PREPARACION, LISTO y EN_REPARTO (las cuatro columnas del tablero).
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/EstadoPedido" }
      responses:
        "200":
          description: Pedidos, del más antiguo al más reciente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PedidoNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /negocio/pedidos/{id}:
    parameters:
      - $ref: "#/components/parameters/PedidoId"
    get:
      tags: [Negocio · Pedidos]
      operationId: obtenerPedidoNegocio
      summary: Detalle de un pedido con su historial de estados (N02, RF-16)
      responses:
        "200":
          description: Pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /pedidos/{id}/aceptar:
    parameters:
      - $ref: "#/components/parameters/PedidoId"
    post:
      tags: [Negocio · Pedidos]
      operationId: aceptarPedido
      summary: Aceptar un pedido con tiempo estimado (RECIBIDO → EN_PREPARACION, RF-15)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tiempoEstimadoMin]
              properties:
                tiempoEstimadoMin:
                  type: integer
                  minimum: 5
                  maximum: 120
                  description: Minutos hasta la entrega que verá el cliente. La web ofrece 15, 25, 35 y 45.
                  examples: [25]
      responses:
        "200":
          description: Pedido aceptado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/EstadoCambiado" }

  /pedidos/{id}/rechazar:
    parameters:
      - $ref: "#/components/parameters/PedidoId"
    post:
      tags: [Negocio · Pedidos]
      operationId: rechazarPedido
      summary: Rechazar un pedido con motivo (RECIBIDO → RECHAZADO, RF-15)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
                  minLength: 1
                  maxLength: 300
                  description: Lo ve el cliente en la app.
                  examples: [Nos hemos quedado sin pan de hamburguesa.]
      responses:
        "200":
          description: Pedido rechazado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/EstadoCambiado" }

  /pedidos/{id}/listo:
    parameters:
      - $ref: "#/components/parameters/PedidoId"
    post:
      tags: [Negocio · Pedidos]
      operationId: marcarPedidoListo
      summary: Marcar como listo (EN_PREPARACION → LISTO, RF-16)
      responses:
        "200":
          description: Pedido listo para asignar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/EstadoCambiado" }

  /pedidos/{id}/asignar:
    parameters:
      - $ref: "#/components/parameters/PedidoId"
    post:
      tags: [Negocio · Pedidos]
      operationId: asignarRepartidor
      summary: Asignar un repartidor a un pedido listo (LISTO → EN_REPARTO, N08, RF-20)
      description: |
        En una transacción con bloqueo del pedido (arquitectura 5.4): comprueba que el repartidor es
        del negocio, está activo y disponible, crea el reparto y pasa el pedido a EN_REPARTO.
        Si dos personas del negocio lo asignan a la vez, la segunda recibe 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repartidorId]
              properties:
                repartidorId: { type: string, format: uuid }
      responses:
        "200":
          description: Pedido en reparto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/EstadoCambiado" }
        "422":
          description: El repartidor no es del negocio, está desactivado o no está disponible
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }

  /negocio/repartidores:
    get:
      tags: [Negocio · Pedidos]
      operationId: listarRepartidoresNegocio
      summary: Repartidores del negocio (selector de N08; gestión completa en N04, RF-19)
      parameters:
        - name: disponible
          in: query
          required: false
          description: |
            `true` = solo activos y disponibles (los que se pueden asignar). Sin él, todos los del
            negocio, también los desactivados.
          schema: { type: boolean }
      responses:
        "200":
          description: Repartidores ordenados por nombre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RepartidorNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Supabase Auth.

  parameters:
    NegocioId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PedidoId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Validacion:
      description: Datos de entrada no válidos
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    NoAutenticado:
      description: Falta el token o no es válido
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    Prohibido:
      description: El rol del usuario no permite la operación
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    NoEncontrado:
      description: El recurso no existe
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    EstadoCambiado:
      description: |
        El pedido ya no está en el estado que exige la acción (otra persona del negocio se adelantó,
        o el cliente lo canceló). La web vuelve a cargar el tablero.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }

  schemas:
    Rol:
      type: string
      enum: [CLIENTE, NEGOCIO, REPARTIDOR, ADMINISTRADOR]

    EstadoIncidencia:
      type: string
      enum: [ABIERTA, RESPONDIDA, RESUELTA]

    TipoIncidencia:
      type: string
      enum: [FALTA_PRODUCTO, RETRASO, PRODUCTO_MAL_ESTADO, CLIENTE_AUSENTE, DIRECCION_INCORRECTA, OTRA]

    OrigenIncidencia:
      type: string
      enum: [CLIENTE, REPARTIDOR]

    EstadoPedido:
      type: string
      enum: [RECIBIDO, EN_PREPARACION, LISTO, EN_REPARTO, ENTREGADO, RECHAZADO, CANCELADO]

    MetodoPago:
      type: string
      description: Siempre se paga al repartidor en la entrega, en efectivo o con tarjeta (datáfono).
      enum: [EFECTIVO, TARJETA]

    Problema:
      type: object
      description: ProblemDetail (RFC 9457) de Spring.
      required: [status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errores:
          type: array
          description: "Solo en 400. Cada elemento es `campo: mensaje`."
          items: { type: string }

    Perfil:
      type: object
      required: [id, nombre, email, rol]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string, format: email }
        telefono: { type: [string, "null"] }
        rol: { $ref: "#/components/schemas/Rol" }
        negocioId: { type: [integer, "null"], format: int64 }
        esDueno: { type: boolean }

    Localidad:
      type: object
      required: [id, nombre, provincia]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string, examples: [Osuna] }
        provincia: { type: string, examples: [Sevilla] }

    DatosNegocio:
      type: object
      required: [nombre, localidadId, direccion, telefono]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100, examples: [Heladería La Sirena] }
        localidadId: { type: integer, format: int64 }
        direccion: { type: string, minLength: 1, maxLength: 200, examples: [C/ San Pedro 5] }
        telefono: { type: string, minLength: 9, maxLength: 20, examples: [955 821 456] }

    AltaNegocio:
      allOf:
        - $ref: "#/components/schemas/DatosNegocio"
        - type: object
          required: [dueno]
          properties:
            dueno:
              type: object
              required: [nombre, email]
              properties:
                nombre: { type: string, minLength: 1, maxLength: 100, examples: [Lola Sánchez] }
                email: { type: string, format: email, examples: [lola@heladerialasirena.es] }

    NegocioAdmin:
      type: object
      required: [id, nombre, localidad, direccion, telefono, dueno, pedidosHoy, abierto, activo, fechaAlta]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        localidad: { $ref: "#/components/schemas/Localidad" }
        direccion: { type: string }
        telefono: { type: string }
        dueno:
          description: Cuenta del dueño. Nula si aún no se ha creado.
          oneOf:
            - $ref: "#/components/schemas/DuenoNegocio"
            - type: "null"
        pedidosHoy: { type: integer, minimum: 0 }
        abierto:
          type: boolean
          description: Si ahora mismo acepta pedidos (horario + interruptor manual del negocio).
        activo:
          type: boolean
          description: false = suspendido por el administrador.
        fechaAlta: { type: string, format: date-time }

    DuenoNegocio:
      type: object
      required: [id, nombre, email]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string, format: email }

    IncidenciaAdmin:
      type: object
      required: [id, tipo, estado, origen, descripcion, fechaCreacion, pedido, negocio]
      properties:
        id: { type: integer, format: int64 }
        tipo: { $ref: "#/components/schemas/TipoIncidencia" }
        estado: { $ref: "#/components/schemas/EstadoIncidencia" }
        origen: { $ref: "#/components/schemas/OrigenIncidencia" }
        descripcion: { type: string }
        respuesta: { type: [string, "null"] }
        fechaCreacion: { type: string, format: date-time }
        fechaResolucion: { type: [string, "null"], format: date-time }
        pedido:
          type: object
          required: [id, codigo]
          properties:
            id: { type: integer, format: int64 }
            codigo: { type: string, examples: [DF-001036] }
        negocio:
          type: object
          required: [id, nombre]
          properties:
            id: { type: integer, format: int64 }
            nombre: { type: string }

    PedidosNegocioHoy:
      type: object
      required: [negocioId, nombre, localidad, pedidos, abierto]
      properties:
        negocioId: { type: integer, format: int64 }
        nombre: { type: string }
        localidad: { type: string }
        pedidos: { type: integer, minimum: 0 }
        abierto: { type: boolean }

    ResumenAdmin:
      type: object
      required:
        - negociosActivos
        - negociosTotales
        - pedidosHoy
        - localidadesConPedidosHoy
        - incidenciasAbiertas
        - incidenciasHoy
        - repartidoresEnRuta
        - pedidosHoyPorNegocio
        - incidenciasRecientes
      properties:
        negociosActivos: { type: integer }
        negociosTotales: { type: integer }
        pedidosHoy: { type: integer }
        localidadesConPedidosHoy: { type: integer }
        incidenciasAbiertas:
          type: integer
          description: ABIERTA + RESPONDIDA.
        incidenciasHoy:
          type: integer
          description: Incidencias abiertas comunicadas hoy.
        repartidoresEnRuta:
          type: integer
          description: Repartidores con algún reparto EN_REPARTO ahora mismo.
        pedidosHoyPorNegocio:
          type: array
          description: Negocios activos, de más a menos pedidos hoy.
          items: { $ref: "#/components/schemas/PedidosNegocioHoy" }
        incidenciasRecientes:
          type: array
          description: Las 5 últimas incidencias sin resolver.
          items: { $ref: "#/components/schemas/IncidenciaAdmin" }

    MiNegocio:
      type: object
      required: [id, nombre, localidad, abierto, abiertoManual, pedidosHoy]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string, examples: [Hamburguesería Pepe] }
        localidad: { $ref: "#/components/schemas/Localidad" }
        abierto:
          type: boolean
          description: Si ahora mismo acepta pedidos (en horario y con `abiertoManual`).
        abiertoManual:
          type: boolean
          description: Interruptor "Abierto" de la cabecera.
        pedidosHoy:
          type: integer
          minimum: 0
          description: Pedidos recibidos hoy (Europe/Madrid), en cualquier estado salvo CANCELADO.

    LineaPedido:
      type: object
      required: [nombreProducto, precioUnitario, cantidad, importe]
      properties:
        nombreProducto: { type: string, description: Copia del nombre al hacer el pedido., examples: [Menú DeliFast] }
        precioUnitario: { type: number, examples: [8.5] }
        cantidad: { type: integer, minimum: 1 }
        importe: { type: number, description: precioUnitario × cantidad. }

    CambioEstado:
      type: object
      required: [estadoNuevo, fecha]
      properties:
        estadoAnterior:
          description: Nulo en el primer registro (creación del pedido).
          oneOf:
            - $ref: "#/components/schemas/EstadoPedido"
            - type: "null"
        estadoNuevo: { $ref: "#/components/schemas/EstadoPedido" }
        fecha: { type: string, format: date-time }
        autor:
          type: [string, "null"]
          description: Nombre de quien hizo el cambio (cliente, persona del negocio o repartidor).

    RepartoPedido:
      type: object
      required: [id, repartidor, fechaAsignacion]
      properties:
        id: { type: integer, format: int64 }
        repartidor:
          type: object
          required: [id, nombre]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        fechaAsignacion: { type: string, format: date-time }
        fechaEntrega: { type: [string, "null"], format: date-time }

    PedidoNegocio:
      type: object
      required:
        - id
        - codigo
        - estado
        - fechaCreacion
        - cliente
        - direccionEntrega
        - telefonoContacto
        - metodoPago
        - lineas
        - subtotal
        - gastosEnvio
        - total
        - historial
      properties:
        id: { type: integer, format: int64 }
        codigo: { type: string, examples: [DF-001043] }
        estado: { $ref: "#/components/schemas/EstadoPedido" }
        fechaCreacion: { type: string, format: date-time }
        cliente:
          type: object
          required: [nombre]
          properties:
            nombre: { type: string, examples: [Antonio Pérez] }
        direccionEntrega:
          type: string
          description: Copia de la dirección al hacer el pedido, con la localidad.
          examples: [Av. de la Constitución 8, 1º A · Osuna]
        telefonoContacto: { type: string, examples: [612 345 678] }
        metodoPago: { $ref: "#/components/schemas/MetodoPago" }
        nota: { type: [string, "null"], examples: [Sin cebolla en el menú, por favor.] }
        lineas:
          type: array
          items: { $ref: "#/components/schemas/LineaPedido" }
        subtotal: { type: number }
        gastosEnvio: { type: number }
        total: { type: number }
        tiempoEstimadoMin:
          type: [integer, "null"]
          description: Se fija al aceptar.
        motivoRechazo: { type: [string, "null"] }
        reparto:
          description: Solo desde EN_REPARTO.
          oneOf:
            - $ref: "#/components/schemas/RepartoPedido"
            - type: "null"
        historial:
          type: array
          description: Cambios de estado, del más antiguo al más reciente (RF-16).
          items: { $ref: "#/components/schemas/CambioEstado" }

    RepartidorNegocio:
      type: object
      required: [id, nombre, email, activo, disponible, pedidosEnReparto]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, examples: [Marta Díaz] }
        email: { type: string, format: email }
        telefono: { type: [string, "null"] }
        activo:
          type: boolean
          description: false = desactivado por el negocio; no puede iniciar sesión.
        disponible:
          type: boolean
          description: Lo marca el propio repartidor desde su perfil (R06).
        pedidosEnReparto:
          type: integer
          minimum: 0
          description: Repartos suyos que siguen EN_REPARTO.

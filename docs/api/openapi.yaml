openapi: 3.1.0
info:
  title: DeliFast API
  version: 0.6.0
  description: |
    Contrato REST de la API de DeliFast (Spring Boot). Es la fuente de verdad compartida
    entre `DeliFast_Web` (que genera sus tipos con `npm run api:types`) y `DeliFast_Backend`
    (que lo copia en `docs/api/openapi.yaml` y lo implementa).

    Cubre la zona de **administración** (RF-28..RF-31), el **panel del negocio** (pedidos
    RF-14..RF-16 y RF-20, carta RF-17, configuración RF-18, equipo RF-19, incidencias RF-21, estadísticas RF-22) y lo mínimo común (`/me`,
    `/localidades`). El resto del negocio y el repartidor se añadirán aquí cuando se programen.

    Convenciones:
    - JSON en `camelCase`. Fechas en ISO 8601 con zona (`2026-11-06T13:10:00Z`).
      Importes como número con 2 decimales.
    - Autenticación: `Authorization: Bearer <JWT de Supabase>`. El rol va en el claim
      `user_rol` (añadido por `custom_access_token_hook`). Todo `/admin/**` exige `ADMINISTRADOR`.
      Todo `/negocio/**` y las acciones del negocio sobre `/pedidos/{id}/...` exigen `NEGOCIO`
      (dueño o empleado, sin más restricciones en la v1) y solo actúan sobre el negocio del
      claim `negocio_id`: un pedido de otro negocio responde 404, no 403.
    - Errores con `application/problem+json` (RFC 9457), como ya hace `GlobalExceptionHandler`:
      400 validación (con `errores`), 401 sin token, 403 rol incorrecto, 404 no existe,
      409 conflicto (p. ej. email ya registrado, o el pedido ya cambió de estado porque otra
      persona del negocio se adelantó), 422 regla de negocio.
    - Imágenes (arquitectura 5.5): se suben en la misma petición que los datos, como
      `multipart/form-data` con una parte `datos` (JSON) y otra con el fichero. El backend
      comprueba el tipo real (JPEG, PNG o WebP) y el tamaño (máx. 2 MB) y la sube a Storage;
      si no vale responde 400 con el error en `errores`.
    - Las listas de administración son pequeñas (decenas de filas), así que se devuelven
      completas, sin paginar.
servers:
  - url: http://localhost:8080
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Perfil
  - name: Localidades
  - name: Administración
  - name: Negocio · Carta
    description: Categorías y productos del negocio del token (N03, RF-17).
  - name: Negocio · Configuración
    description: Datos, logo, horario y apertura del negocio del token (N07, RF-18).
  - name: Negocio · Equipo
    description: |
      Empleados y repartidores del negocio (N04, RF-19). Cualquier persona del negocio los ve,
      edita y activa o desactiva; **solo el dueño** (`es_dueno` en el token) crea cuentas nuevas:
      el resto recibe 403. El alta crea la cuenta en Supabase Auth con la Admin API
      (`inviteUserByEmail`, `app_metadata` = `{rol, negocio_id}`) y la persona recibe un email para
      crear su contraseña. Desactivar una cuenta cierra sus sesiones (arquitectura 5.1).
  - name: Negocio · Incidencias
    description: |
      Incidencias de los pedidos del negocio (N05, RF-21). Las comunica el cliente desde la app o el
      repartidor (RF-12, RF-26). El negocio responde (ABIERTA → RESPONDIDA, el cliente ve la
      respuesta) y la marca como resuelta (→ RESUELTA). Quien responde o resuelve queda como
      `responsable_id`.
  - name: Negocio · Estadísticas
    description: Cifras del negocio calculadas con consultas SQL en `EstadisticasService` (N06, RF-22).
  - name: Negocio · Pedidos
    description: |
      Panel de pedidos del negocio (N01, N02, N08). Estados: RECIBIDO → EN_PREPARACION (aceptar)
      → LISTO → EN_REPARTO (asignar repartidor) → ENTREGADO (lo confirma el repartidor).
      RECIBIDO → RECHAZADO (rechazar). Cada cambio guarda una fila en `cambios_estado`.

      Tiempo real: la web no recibe los pedidos por la API sino por Supabase Realtime
      (`postgres_changes` sobre `public.pedidos` con `negocio_id=eq.<id>`, filtrado además por RLS).
      Al recibir un cambio vuelve a pedir `GET /negocio/pedidos`.
paths:
  /me:
    get:
      tags: [Perfil]
      operationId: obtenerPerfil
      summary: Perfil del usuario autenticado
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Perfil" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /localidades:
    get:
      tags: [Localidades]
      operationId: listarLocalidades
      summary: Localidades donde opera DeliFast
      description: Pública (también la usa la app al registrarse). Ordenadas por nombre.
      security: []
      responses:
        "200":
          description: Localidades
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Localidad" }

  /admin/resumen:
    get:
      tags: [Administración]
      operationId: obtenerResumenAdmin
      summary: Resumen de la plataforma (A01, RF-31)
      description: Indicadores del día (zona horaria Europe/Madrid), pedidos de hoy por negocio e incidencias recientes.
      responses:
        "200":
          description: Resumen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResumenAdmin" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /admin/negocios:
    get:
      tags: [Administración]
      operationId: listarNegociosAdmin
      summary: Negocios dados de alta (A02, RF-29)
      parameters:
        - name: activo
          in: query
          required: false
          description: Filtra por activos (`true`) o suspendidos (`false`). Sin él, todos.
          schema: { type: boolean }
      responses:
        "200":
          description: Negocios ordenados por nombre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NegocioAdmin" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [Administración]
      operationId: altaNegocio
      summary: Dar de alta un negocio y la cuenta de su dueño (A03, RF-28)
      description: |
        En una transacción: crea el negocio y la cuenta del dueño en Supabase Auth con la
        Admin API (`inviteUserByEmail`, con `app_metadata` = `{rol: NEGOCIO, negocio_id, es_dueno: true}`).
        El dueño recibe un email para crear su contraseña. Si falla la invitación, no se crea el negocio.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AltaNegocio" }
      responses:
        "201":
          description: Negocio creado
          headers:
            Location:
              description: URL del negocio creado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NegocioAdmin" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409":
          description: Ya existe una cuenta con ese email
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }

  /admin/negocios/{id}:
    parameters:
      - $ref: "#/components/parameters/NegocioId"
    put:
      tags: [Administración]
      operationId: editarNegocioAdmin
      summary: Corregir los datos básicos de un negocio (icono de editar en A02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatosNegocio" }
      responses:
        "200":
          description: Negocio actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NegocioAdmin" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /admin/negocios/{id}/activo:
    parameters:
      - $ref: "#/components/parameters/NegocioId"
    patch:
      tags: [Administración]
      operationId: cambiarActivoNegocio
      summary: Activar o suspender un negocio (interruptor de A02, RF-29)
      description: |
        Un negocio suspendido deja de aparecer en la app y sus cuentas no pueden iniciar sesión
        (el hook del token lo rechaza). Al suspender, el backend cierra las sesiones abiertas de
        sus cuentas con la Admin API (arquitectura 5.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties:
                activo: { type: boolean }
      responses:
        "200":
          description: Negocio actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NegocioAdmin" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /admin/incidencias:
    get:
      tags: [Administración]
      operationId: listarIncidenciasAdmin
      summary: Incidencias de todos los negocios (A04, RF-30)
      parameters:
        - name: estado
          in: query
          required: false
          description: |
            Uno o varios estados (`?estado=ABIERTA&estado=RESPONDIDA`). Sin él, todas.
            El filtro "Abiertas" de la web pide ABIERTA y RESPONDIDA (aún sin resolver).
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/EstadoIncidencia" }
        - name: negocioId
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Incidencias, de la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncidenciaAdmin" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /negocio:
    get:
      tags: [Negocio · Configuración]
      operationId: obtenerMiNegocio
      summary: Datos y configuración del negocio del usuario (cabecera del panel y N07)
      responses:
        "200":
          description: Negocio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MiNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
    put:
      tags: [Negocio · Configuración]
      operationId: editarMiNegocio
      summary: Guardar los datos del negocio y, opcionalmente, un logo nuevo (N07, RF-18)
      description: |
        La localidad no se cambia aquí (la fija el administrador al dar de alta el negocio).
        Si llega `logo`, sustituye al anterior (el backend borra el viejo de Storage).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datos]
              properties:
                datos: { $ref: "#/components/schemas/DatosMiNegocio" }
                logo:
                  type: string
                  format: binary
                  description: JPEG, PNG o WebP de hasta 2 MB.
            encoding:
              datos: { contentType: application/json }
      responses:
        "200":
          description: Negocio actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MiNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /negocio/horarios:
    put:
      tags: [Negocio · Configuración]
      operationId: editarHorariosNegocio
      summary: Sustituir el horario de apertura completo (N07, RF-18)
      description: |
        Reemplaza todas las franjas del negocio. Un día sin franjas está cerrado. Una franja cuyo
        cierre es anterior a la apertura pasa de medianoche (20:00–00:30). Las franjas de un mismo
        día no pueden solaparse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 21
              items: { $ref: "#/components/schemas/FranjaHorario" }
      responses:
        "200":
          description: Negocio con el horario nuevo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MiNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /negocio/abierto:
    patch:
      tags: [Negocio · Configuración]
      operationId: cambiarAbiertoNegocio
      summary: Abrir o cerrar el negocio a mano (interruptor "Abierto", RF-18)
      description: |
        Cambia `negocios.abierto_manual`. Con él a false el negocio no acepta pedidos aunque esté
        en horario; con él a true acepta pedidos solo dentro del horario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [abierto]
              properties:
                abierto: { type: boolean }
      responses:
        "200":
          description: Negocio actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MiNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /negocio/carta:
    get:
      tags: [Negocio · Carta]
      operationId: obtenerCartaNegocio
      summary: Carta completa del negocio (N03)
      description: Categorías por `orden` con sus productos en el orden en que se crearon (id), incluidos los agotados. Sin los borrados.
      responses:
        "200":
          description: Carta
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CategoriaCarta" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /negocio/categorias:
    post:
      tags: [Negocio · Carta]
      operationId: crearCategoria
      summary: Nueva categoría (se añade al final)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatosCategoria" }
      responses:
        "201":
          description: Categoría creada (sin productos)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoriaCarta" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409":
          description: Ya hay una categoría con ese nombre en el negocio
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }

  /negocio/categorias/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoriaId"
    put:
      tags: [Negocio · Carta]
      operationId: editarCategoria
      summary: Renombrar una categoría
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatosCategoria" }
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoriaCarta" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: Ya hay una categoría con ese nombre en el negocio
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
    delete:
      tags: [Negocio · Carta]
      operationId: borrarCategoria
      summary: Borrar una categoría vacía
      responses:
        "204": { description: Borrada }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La categoría aún tiene productos; hay que borrarlos o moverlos antes
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }

  /negocio/productos:
    post:
      tags: [Negocio · Carta]
      operationId: crearProducto
      summary: Nuevo producto con foto opcional (N03, RF-17)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FormularioProducto" }
            encoding:
              datos: { contentType: application/json }
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductoCarta" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /negocio/productos/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductoId"
    put:
      tags: [Negocio · Carta]
      operationId: editarProducto
      summary: Editar un producto (y cambiar o quitar su foto)
      description: Sin `foto` se conserva la actual, salvo que `datos.quitarFoto` sea true.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FormularioProducto" }
            encoding:
              datos: { contentType: application/json }
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductoCarta" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    delete:
      tags: [Negocio · Carta]
      operationId: borrarProducto
      summary: Borrar un producto
      description: Borrado lógico (`activo = false`) para no romper los pedidos antiguos. La foto se borra de Storage.
      responses:
        "204": { description: Borrado }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /negocio/productos/{id}/disponible:
    parameters:
      - $ref: "#/components/parameters/ProductoId"
    patch:
      tags: [Negocio · Carta]
      operationId: cambiarDisponibleProducto
      summary: Marcar un producto como disponible o agotado (interruptor de N03)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disponible]
              properties:
                disponible: { type: boolean }
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductoCarta" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /negocio/pedidos:
    get:
      tags: [Negocio · Pedidos]
      operationId: listarPedidosNegocio
      summary: Pedidos del negocio (tablero N01, RF-14)
      parameters:
        - name: estado
          in: query
          required: false
          description: |
            Uno o varios estados (`?estado=RECIBIDO&estado=LISTO`). Sin él, los activos:
            RECIBIDO, EN_PREPARACION, LISTO y EN_REPARTO (las cuatro columnas del tablero).
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/EstadoPedido" }
      responses:
        "200":
          description: Pedidos, del más antiguo al más reciente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PedidoNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /negocio/pedidos/{id}:
    parameters:
      - $ref: "#/components/parameters/PedidoId"
    get:
      tags: [Negocio · Pedidos]
      operationId: obtenerPedidoNegocio
      summary: Detalle de un pedido con su historial de estados (N02, RF-16)
      responses:
        "200":
          description: Pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /pedidos/{id}/aceptar:
    parameters:
      - $ref: "#/components/parameters/PedidoId"
    post:
      tags: [Negocio · Pedidos]
      operationId: aceptarPedido
      summary: Aceptar un pedido con tiempo estimado (RECIBIDO → EN_PREPARACION, RF-15)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tiempoEstimadoMin]
              properties:
                tiempoEstimadoMin:
                  type: integer
                  minimum: 5
                  maximum: 120
                  description: Minutos hasta la entrega que verá el cliente. La web ofrece 15, 25, 35 y 45.
                  examples: [25]
      responses:
        "200":
          description: Pedido aceptado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/EstadoCambiado" }

  /pedidos/{id}/rechazar:
    parameters:
      - $ref: "#/components/parameters/PedidoId"
    post:
      tags: [Negocio · Pedidos]
      operationId: rechazarPedido
      summary: Rechazar un pedido con motivo (RECIBIDO → RECHAZADO, RF-15)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
                  minLength: 1
                  maxLength: 300
                  description: Lo ve el cliente en la app.
                  examples: [Nos hemos quedado sin pan de hamburguesa.]
      responses:
        "200":
          description: Pedido rechazado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/EstadoCambiado" }

  /pedidos/{id}/listo:
    parameters:
      - $ref: "#/components/parameters/PedidoId"
    post:
      tags: [Negocio · Pedidos]
      operationId: marcarPedidoListo
      summary: Marcar como listo (EN_PREPARACION → LISTO, RF-16)
      responses:
        "200":
          description: Pedido listo para asignar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/EstadoCambiado" }

  /pedidos/{id}/asignar:
    parameters:
      - $ref: "#/components/parameters/PedidoId"
    post:
      tags: [Negocio · Pedidos]
      operationId: asignarRepartidor
      summary: Asignar un repartidor a un pedido listo (LISTO → EN_REPARTO, N08, RF-20)
      description: |
        En una transacción con bloqueo del pedido (arquitectura 5.4): comprueba que el repartidor es
        del negocio, está activo y disponible, crea el reparto y pasa el pedido a EN_REPARTO.
        Si dos personas del negocio lo asignan a la vez, la segunda recibe 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repartidorId]
              properties:
                repartidorId: { type: string, format: uuid }
      responses:
        "200":
          description: Pedido en reparto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/EstadoCambiado" }
        "422":
          description: El repartidor no es del negocio, está desactivado o no está disponible
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }

  /negocio/repartidores:
    get:
      tags: [Negocio · Equipo]
      operationId: listarRepartidoresNegocio
      summary: Repartidores del negocio (N04 y selector de N08)
      parameters:
        - name: disponible
          in: query
          required: false
          description: |
            `true` = solo activos y disponibles (los que se pueden asignar, N08). Sin él, todos los
            del negocio, también los desactivados.
          schema: { type: boolean }
      responses:
        "200":
          description: Repartidores ordenados por nombre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RepartidorNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [Negocio · Equipo]
      operationId: altaRepartidor
      summary: Crear la cuenta de un repartidor (solo el dueño, RF-19)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AltaMiembro" }
      responses:
        "201":
          description: Repartidor creado; recibe un email para crear su contraseña
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepartidorNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403":
          description: No es el dueño del negocio
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "409": { $ref: "#/components/responses/EmailRegistrado" }

  /negocio/repartidores/{id}:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
    put:
      tags: [Negocio · Equipo]
      operationId: editarRepartidor
      summary: Corregir el nombre o el teléfono de un repartidor
      description: El email no se cambia (es el de su cuenta).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatosMiembro" }
      responses:
        "200":
          description: Repartidor actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepartidorNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /negocio/repartidores/{id}/activo:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
    patch:
      tags: [Negocio · Equipo]
      operationId: cambiarActivoRepartidor
      summary: Activar o desactivar un repartidor (RF-19)
      description: |
        Desactivado no puede iniciar sesión, no aparece en el selector de N08 y se le cierran las
        sesiones. Sus repartos EN_REPARTO siguen asignados a él.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties:
                activo: { type: boolean }
      responses:
        "200":
          description: Repartidor actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepartidorNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /negocio/empleados:
    get:
      tags: [Negocio · Equipo]
      operationId: listarEmpleadosNegocio
      summary: Personas del negocio (dueño y empleados, N04)
      responses:
        "200":
          description: El dueño primero y luego los empleados por nombre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmpleadoNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [Negocio · Equipo]
      operationId: altaEmpleado
      summary: Crear la cuenta de un empleado (solo el dueño, RF-19 ampliado)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AltaMiembro" }
      responses:
        "201":
          description: Empleado creado; recibe un email para crear su contraseña
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmpleadoNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403":
          description: No es el dueño del negocio
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "409": { $ref: "#/components/responses/EmailRegistrado" }

  /negocio/empleados/{id}:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
    put:
      tags: [Negocio · Equipo]
      operationId: editarEmpleado
      summary: Corregir el nombre o el teléfono de un empleado (o del dueño)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatosMiembro" }
      responses:
        "200":
          description: Empleado actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmpleadoNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /negocio/empleados/{id}/activo:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
    patch:
      tags: [Negocio · Equipo]
      operationId: cambiarActivoEmpleado
      summary: Activar o desactivar un empleado
      description: El dueño está siempre activo (422 si se intenta desactivar).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties:
                activo: { type: boolean }
      responses:
        "200":
          description: Empleado actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmpleadoNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "422":
          description: No se puede desactivar al dueño
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }


  /negocio/incidencias:
    get:
      tags: [Negocio · Incidencias]
      operationId: listarIncidenciasNegocio
      summary: Incidencias de los pedidos del negocio (N05, RF-21)
      parameters:
        - name: estado
          in: query
          required: false
          description: |
            Uno o varios estados. Sin él, todas. El filtro "Abiertas" de la web pide ABIERTA y RESPONDIDA.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/EstadoIncidencia" }
      responses:
        "200":
          description: Incidencias, de la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncidenciaNegocio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /incidencias/{id}/responder:
    parameters:
      - $ref: "#/components/parameters/IncidenciaId"
    post:
      tags: [Negocio · Incidencias]
      operationId: responderIncidencia
      summary: Responder una incidencia (→ RESPONDIDA, RF-21)
      description: Si ya estaba respondida, sustituye la respuesta. El cliente la ve en la app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [respuesta]
              properties:
                respuesta: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Incidencia respondida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidenciaNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La incidencia ya está resuelta
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }

  /incidencias/{id}/resolver:
    parameters:
      - $ref: "#/components/parameters/IncidenciaId"
    post:
      tags: [Negocio · Incidencias]
      operationId: resolverIncidencia
      summary: Marcar una incidencia como resuelta (→ RESUELTA, RF-21)
      description: Si llega `respuesta`, se guarda a la vez. Guarda la fecha de resolución.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                respuesta: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Incidencia resuelta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidenciaNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La incidencia ya está resuelta
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }


  /negocio/estadisticas:
    get:
      tags: [Negocio · Estadísticas]
      operationId: obtenerEstadisticasNegocio
      summary: Estadísticas del negocio por día, semana o mes (N06, RF-22)
      description: |
        Periodo actual en Europe/Madrid que contiene `fecha` (hoy si no llega): el día, la semana
        de lunes a domingo o el mes natural. Cuenta los pedidos no rechazados ni cancelados; la
        facturación suma el total de los ENTREGADO. Cada cifra trae la del periodo anterior para
        compararla.
      parameters:
        - name: periodo
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Periodo" }
        - name: fecha
          in: query
          required: false
          description: Un día del periodo que se quiere ver (por defecto, hoy).
          schema: { type: string, format: date }
      responses:
        "200":
          description: Estadísticas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstadisticasNegocio" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Supabase Auth.

  parameters:
    NegocioId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PedidoId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CategoriaId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ProductoId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IncidenciaId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UsuarioId:
      name: id
      in: path
      required: true
      description: Id de la cuenta (el de `auth.users` y `perfiles`).
      schema: { type: string, format: uuid }

  responses:
    Validacion:
      description: Datos de entrada no válidos
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    NoAutenticado:
      description: Falta el token o no es válido
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    Prohibido:
      description: El rol del usuario no permite la operación
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    NoEncontrado:
      description: El recurso no existe
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    EmailRegistrado:
      description: Ya existe una cuenta con ese email
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    EstadoCambiado:
      description: |
        El pedido ya no está en el estado que exige la acción (otra persona del negocio se adelantó,
        o el cliente lo canceló). La web vuelve a cargar el tablero.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }

  schemas:
    Rol:
      type: string
      enum: [CLIENTE, NEGOCIO, REPARTIDOR, ADMINISTRADOR]

    EstadoIncidencia:
      type: string
      enum: [ABIERTA, RESPONDIDA, RESUELTA]

    TipoIncidencia:
      type: string
      enum: [FALTA_PRODUCTO, RETRASO, PRODUCTO_MAL_ESTADO, CLIENTE_AUSENTE, DIRECCION_INCORRECTA, OTRA]

    OrigenIncidencia:
      type: string
      enum: [CLIENTE, REPARTIDOR]

    EstadoPedido:
      type: string
      enum: [RECIBIDO, EN_PREPARACION, LISTO, EN_REPARTO, ENTREGADO, RECHAZADO, CANCELADO]

    MetodoPago:
      type: string
      description: Siempre se paga al repartidor en la entrega, en efectivo o con tarjeta (datáfono).
      enum: [EFECTIVO, TARJETA]

    Problema:
      type: object
      description: ProblemDetail (RFC 9457) de Spring.
      required: [status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errores:
          type: array
          description: "Solo en 400. Cada elemento es `campo: mensaje`."
          items: { type: string }

    Perfil:
      type: object
      required: [id, nombre, email, rol]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string, format: email }
        telefono: { type: [string, "null"] }
        rol: { $ref: "#/components/schemas/Rol" }
        negocioId: { type: [integer, "null"], format: int64 }
        esDueno: { type: boolean }

    Localidad:
      type: object
      required: [id, nombre, provincia]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string, examples: [Osuna] }
        provincia: { type: string, examples: [Sevilla] }

    DatosNegocio:
      type: object
      required: [nombre, localidadId, direccion, telefono]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100, examples: [Heladería La Sirena] }
        localidadId: { type: integer, format: int64 }
        direccion: { type: string, minLength: 1, maxLength: 200, examples: [C/ San Pedro 5] }
        telefono: { type: string, minLength: 9, maxLength: 20, examples: [955 821 456] }

    AltaNegocio:
      allOf:
        - $ref: "#/components/schemas/DatosNegocio"
        - type: object
          required: [dueno]
          properties:
            dueno:
              type: object
              required: [nombre, email]
              properties:
                nombre: { type: string, minLength: 1, maxLength: 100, examples: [Lola Sánchez] }
                email: { type: string, format: email, examples: [lola@heladerialasirena.es] }

    NegocioAdmin:
      type: object
      required: [id, nombre, localidad, direccion, telefono, dueno, pedidosHoy, abierto, activo, fechaAlta]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        localidad: { $ref: "#/components/schemas/Localidad" }
        direccion: { type: string }
        telefono: { type: string }
        dueno:
          description: Cuenta del dueño. Nula si aún no se ha creado.
          oneOf:
            - $ref: "#/components/schemas/DuenoNegocio"
            - type: "null"
        pedidosHoy: { type: integer, minimum: 0 }
        abierto:
          type: boolean
          description: Si ahora mismo acepta pedidos (horario + interruptor manual del negocio).
        activo:
          type: boolean
          description: false = suspendido por el administrador.
        fechaAlta: { type: string, format: date-time }

    DuenoNegocio:
      type: object
      required: [id, nombre, email]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string, format: email }

    IncidenciaAdmin:
      type: object
      required: [id, tipo, estado, origen, descripcion, fechaCreacion, pedido, negocio]
      properties:
        id: { type: integer, format: int64 }
        tipo: { $ref: "#/components/schemas/TipoIncidencia" }
        estado: { $ref: "#/components/schemas/EstadoIncidencia" }
        origen: { $ref: "#/components/schemas/OrigenIncidencia" }
        descripcion: { type: string }
        respuesta: { type: [string, "null"] }
        fechaCreacion: { type: string, format: date-time }
        fechaResolucion: { type: [string, "null"], format: date-time }
        pedido:
          type: object
          required: [id, codigo]
          properties:
            id: { type: integer, format: int64 }
            codigo: { type: string, examples: [DF-001036] }
        negocio:
          type: object
          required: [id, nombre]
          properties:
            id: { type: integer, format: int64 }
            nombre: { type: string }

    PedidosNegocioHoy:
      type: object
      required: [negocioId, nombre, localidad, pedidos, abierto]
      properties:
        negocioId: { type: integer, format: int64 }
        nombre: { type: string }
        localidad: { type: string }
        pedidos: { type: integer, minimum: 0 }
        abierto: { type: boolean }

    ResumenAdmin:
      type: object
      required:
        - negociosActivos
        - negociosTotales
        - pedidosHoy
        - localidadesConPedidosHoy
        - incidenciasAbiertas
        - incidenciasHoy
        - repartidoresEnRuta
        - pedidosHoyPorNegocio
        - incidenciasRecientes
      properties:
        negociosActivos: { type: integer }
        negociosTotales: { type: integer }
        pedidosHoy: { type: integer }
        localidadesConPedidosHoy: { type: integer }
        incidenciasAbiertas:
          type: integer
          description: ABIERTA + RESPONDIDA.
        incidenciasHoy:
          type: integer
          description: Incidencias abiertas comunicadas hoy.
        repartidoresEnRuta:
          type: integer
          description: Repartidores con algún reparto EN_REPARTO ahora mismo.
        pedidosHoyPorNegocio:
          type: array
          description: Negocios activos, de más a menos pedidos hoy.
          items: { $ref: "#/components/schemas/PedidosNegocioHoy" }
        incidenciasRecientes:
          type: array
          description: Las 5 últimas incidencias sin resolver.
          items: { $ref: "#/components/schemas/IncidenciaAdmin" }

    MiNegocio:
      type: object
      required: [id, nombre, localidad, direccion, telefono, gastosEnvio, pedidoMinimo, horarios, abierto, abiertoManual, pedidosHoy]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string, examples: [Hamburguesería Pepe] }
        descripcion: { type: [string, "null"] }
        localidad: { $ref: "#/components/schemas/Localidad" }
        direccion: { type: string, examples: [C/ Sevilla 24] }
        telefono: { type: string, examples: [955 820 123] }
        logoUrl:
          type: [string, "null"]
          description: URL pública del logo en Supabase Storage (bucket `logos`).
        gastosEnvio: { type: number, minimum: 0, examples: [1.5] }
        pedidoMinimo: { type: number, minimum: 0, examples: [10] }
        horarios:
          type: array
          description: Franjas de apertura, por día y hora de apertura.
          items: { $ref: "#/components/schemas/FranjaHorario" }
        abierto:
          type: boolean
          description: Si ahora mismo acepta pedidos (en horario y con `abiertoManual`).
        abiertoManual:
          type: boolean
          description: Interruptor "Abierto" de la cabecera.
        pedidosHoy:
          type: integer
          minimum: 0
          description: Pedidos recibidos hoy (Europe/Madrid), en cualquier estado salvo CANCELADO.

    DatosMiNegocio:
      type: object
      required: [nombre, telefono, direccion, gastosEnvio, pedidoMinimo]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        descripcion: { type: [string, "null"], maxLength: 300 }
        telefono: { type: string, minLength: 9, maxLength: 20 }
        direccion: { type: string, minLength: 1, maxLength: 200 }
        gastosEnvio: { type: number, minimum: 0, maximum: 50 }
        pedidoMinimo: { type: number, minimum: 0, maximum: 200 }

    FranjaHorario:
      type: object
      required: [dia, apertura, cierre]
      properties:
        dia:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 = lunes … 7 = domingo.
        apertura: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", examples: ["12:30"] }
        cierre:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: Distinta de la apertura. Si es anterior, la franja pasa de medianoche.
          examples: ["16:00"]

    DatosCategoria:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 60, examples: [Hamburguesas] }

    CategoriaCarta:
      type: object
      required: [id, nombre, orden, productos]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        orden: { type: integer }
        productos:
          type: array
          items: { $ref: "#/components/schemas/ProductoCarta" }

    ProductoCarta:
      type: object
      required: [id, categoriaId, nombre, precio, disponible]
      properties:
        id: { type: integer, format: int64 }
        categoriaId: { type: integer, format: int64 }
        nombre: { type: string, examples: [Hamburguesa clásica] }
        descripcion: { type: [string, "null"], examples: [Ternera, queso, lechuga y tomate] }
        precio: { type: number, minimum: 0, examples: [6.5] }
        fotoUrl:
          type: [string, "null"]
          description: URL pública de la foto en Supabase Storage (bucket `productos`).
        disponible:
          type: boolean
          description: false = agotado; la app lo muestra pero no deja pedirlo (RF-06).

    DatosProducto:
      type: object
      required: [categoriaId, nombre, precio, disponible]
      properties:
        categoriaId: { type: integer, format: int64 }
        nombre: { type: string, minLength: 1, maxLength: 100 }
        descripcion: { type: [string, "null"], maxLength: 300 }
        precio: { type: number, minimum: 0, maximum: 999.99 }
        disponible: { type: boolean }
        quitarFoto:
          type: boolean
          description: Solo al editar. true borra la foto actual (si no llega una nueva).

    FormularioProducto:
      type: object
      required: [datos]
      properties:
        datos: { $ref: "#/components/schemas/DatosProducto" }
        foto:
          type: string
          format: binary
          description: JPEG, PNG o WebP de hasta 2 MB.

    LineaPedido:
      type: object
      required: [nombreProducto, precioUnitario, cantidad, importe]
      properties:
        nombreProducto: { type: string, description: Copia del nombre al hacer el pedido., examples: [Menú DeliFast] }
        precioUnitario: { type: number, examples: [8.5] }
        cantidad: { type: integer, minimum: 1 }
        importe: { type: number, description: precioUnitario × cantidad. }

    CambioEstado:
      type: object
      required: [estadoNuevo, fecha]
      properties:
        estadoAnterior:
          description: Nulo en el primer registro (creación del pedido).
          oneOf:
            - $ref: "#/components/schemas/EstadoPedido"
            - type: "null"
        estadoNuevo: { $ref: "#/components/schemas/EstadoPedido" }
        fecha: { type: string, format: date-time }
        autor:
          type: [string, "null"]
          description: Nombre de quien hizo el cambio (cliente, persona del negocio o repartidor).

    RepartoPedido:
      type: object
      required: [id, repartidor, fechaAsignacion]
      properties:
        id: { type: integer, format: int64 }
        repartidor:
          type: object
          required: [id, nombre]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        fechaAsignacion: { type: string, format: date-time }
        fechaEntrega: { type: [string, "null"], format: date-time }

    PedidoNegocio:
      type: object
      required:
        - id
        - codigo
        - estado
        - fechaCreacion
        - cliente
        - direccionEntrega
        - telefonoContacto
        - metodoPago
        - lineas
        - subtotal
        - gastosEnvio
        - total
        - historial
      properties:
        id: { type: integer, format: int64 }
        codigo: { type: string, examples: [DF-001043] }
        estado: { $ref: "#/components/schemas/EstadoPedido" }
        fechaCreacion: { type: string, format: date-time }
        cliente:
          type: object
          required: [nombre]
          properties:
            nombre: { type: string, examples: [Antonio Pérez] }
        direccionEntrega:
          type: string
          description: Copia de la dirección al hacer el pedido, con la localidad.
          examples: [Av. de la Constitución 8, 1º A · Osuna]
        telefonoContacto: { type: string, examples: [612 345 678] }
        metodoPago: { $ref: "#/components/schemas/MetodoPago" }
        nota: { type: [string, "null"], examples: [Sin cebolla en el menú, por favor.] }
        lineas:
          type: array
          items: { $ref: "#/components/schemas/LineaPedido" }
        subtotal: { type: number }
        gastosEnvio: { type: number }
        total: { type: number }
        tiempoEstimadoMin:
          type: [integer, "null"]
          description: Se fija al aceptar.
        motivoRechazo: { type: [string, "null"] }
        reparto:
          description: Solo desde EN_REPARTO.
          oneOf:
            - $ref: "#/components/schemas/RepartoPedido"
            - type: "null"
        historial:
          type: array
          description: Cambios de estado, del más antiguo al más reciente (RF-16).
          items: { $ref: "#/components/schemas/CambioEstado" }

    RepartidorNegocio:
      type: object
      required: [id, nombre, email, activo, disponible, pedidosEnReparto, repartosHoy]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, examples: [Marta Díaz] }
        email: { type: string, format: email }
        telefono: { type: [string, "null"], examples: [655 333 444] }
        activo:
          type: boolean
          description: false = desactivado por el negocio; no puede iniciar sesión.
        disponible:
          type: boolean
          description: Lo marca el propio repartidor desde su perfil (R06).
        pedidosEnReparto:
          type: integer
          minimum: 0
          description: Repartos suyos que siguen EN_REPARTO.
        repartosHoy:
          type: integer
          minimum: 0
          description: Repartos asignados hoy (Europe/Madrid), entregados o no.

    EmpleadoNegocio:
      type: object
      required: [id, nombre, email, esDueno, activo]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, examples: [Ana Moreno] }
        email: { type: string, format: email }
        telefono: { type: [string, "null"] }
        esDueno: { type: boolean }
        activo:
          type: boolean
          description: El dueño siempre está activo.

    DatosMiembro:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        telefono: { type: [string, "null"], maxLength: 20 }

    AltaMiembro:
      allOf:
        - $ref: "#/components/schemas/DatosMiembro"
        - type: object
          required: [email]
          properties:
            email: { type: string, format: email }

    IncidenciaNegocio:
      type: object
      required: [id, tipo, estado, origen, descripcion, fechaCreacion, autor, pedido]
      properties:
        id: { type: integer, format: int64 }
        tipo: { $ref: "#/components/schemas/TipoIncidencia" }
        estado: { $ref: "#/components/schemas/EstadoIncidencia" }
        origen: { $ref: "#/components/schemas/OrigenIncidencia" }
        descripcion: { type: string }
        respuesta: { type: [string, "null"] }
        fechaCreacion: { type: string, format: date-time }
        fechaResolucion: { type: [string, "null"], format: date-time }
        autor:
          type: object
          description: Quien la comunicó (el cliente o el repartidor, según `origen`).
          required: [nombre]
          properties:
            nombre: { type: string, examples: [Juan Torres] }
        pedido:
          type: object
          required: [id, codigo, total, metodoPago, cliente]
          properties:
            id: { type: integer, format: int64 }
            codigo: { type: string, examples: [DF-001036] }
            total: { type: number }
            metodoPago: { $ref: "#/components/schemas/MetodoPago" }
            cliente:
              type: object
              required: [nombre, telefono]
              properties:
                nombre: { type: string }
                telefono: { type: string, description: Teléfono de contacto del pedido. }

    Periodo:
      type: string
      enum: [DIA, SEMANA, MES]

    EstadisticasNegocio:
      type: object
      required: [periodo, desde, hasta, pedidos, pedidosAnterior, facturacion, facturacionAnterior, incidencias, serie, masVendidos]
      properties:
        periodo: { $ref: "#/components/schemas/Periodo" }
        desde: { type: string, format: date, examples: ["2026-11-03"] }
        hasta: { type: string, format: date, examples: ["2026-11-09"] }
        pedidos: { type: integer, minimum: 0 }
        pedidosAnterior: { type: integer, minimum: 0, description: Los del periodo anterior equivalente. }
        facturacion: { type: number, minimum: 0 }
        facturacionAnterior: { type: number, minimum: 0 }
        tiempoMedioEntregaMin:
          type: [integer, "null"]
          description: Minutos de media desde que se recibe hasta que se entrega. Nulo si no hubo entregas.
        tiempoMedioEntregaAnteriorMin: { type: [integer, "null"] }
        incidencias:
          type: object
          required: [total, resueltas, abiertas]
          properties:
            total: { type: integer, minimum: 0 }
            resueltas: { type: integer, minimum: 0 }
            abiertas: { type: integer, minimum: 0, description: ABIERTA + RESPONDIDA. }
        serie:
          type: array
          description: |
            Pedidos por tramo para la gráfica: por hora en DIA ("12:00"), por día de la semana en
            SEMANA ("Lun"…"Dom") y por día del mes en MES ("1"…"31"). Incluye los tramos a cero.
          items:
            type: object
            required: [etiqueta, pedidos]
            properties:
              etiqueta: { type: string, examples: [Vie] }
              pedidos: { type: integer, minimum: 0 }
        masVendidos:
          type: array
          description: Los 5 productos con más unidades vendidas en el periodo.
          maxItems: 5
          items:
            type: object
            required: [nombre, unidades]
            properties:
              nombre: { type: string, examples: [Hamburguesa clásica] }
              unidades: { type: integer, minimum: 0 }
